[project]
name = "mathlens"
dynamic = ["version"]
description = "Local-first paper diagnosis and targeted review for Chinese postgraduate mathematics"
license = "MIT"
requires-python = ">=3.11,<3.13"

[project.scripts]
mathlens = "app.cli:main"

[tool.setuptools.dynamic]
version = {attr = "app.version.VERSION"}

[tool.setuptools.packages.find]
include = ["app*"]
